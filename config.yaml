# Pin inspection settings

camera:
  device: 0                # /dev/video0 (Logitech C920)
  width: 2560              # full sensor res; uncompressed YUYV, ~2 fps
  height: 1472
  fourcc: YUYV
  settle_s: 5              # let auto-exposure/focus settle before grabbing
  # The C920's 2560x1472 mode stretches the image sideways: the same pin
  # measured ~4.5% longer lying horizontally than vertically (2026-10-21).
  # Frames are squeezed horizontally by this factor before measuring.
  pixel_aspect: 1.045
  # null = leave the camera on auto. Lock these once the station is set up,
  # otherwise exposure drift changes the measured widths.
  autofocus: null
  focus: null              # 0-250, step 5
  exposure: null           # 3-2047 (manual exposure units)

segment:
  search_margin: 0.25      # ignore this fraction of the frame on each side (paper edges, clutter)
  bg_blur: 51              # median blur size used to estimate the background
  upscale: 4               # measure on an upscaled crop for sub-pixel widths
  min_area_px: 100         # smallest blob (full-res pixels) treated as a pin

measure:
  mm_per_px: 0.1554       # 22 mm reference pin = 141.56 px vertically (2026-10-21); recalibrate if the camera moves
  head_width_factor: 1.15  # head = end region wider than this x shaft width
  tip_width_factor: 0.85   # tip = end region narrower than this x shaft width

inspect:
  # PASS needs every tolerance to hold (and the model score, once trained).
  # [min, max]; null = no limit. Lengths in mm (needs mm_per_px above),
  # ratios unitless. Set from 4 good pins (21.4-22.8 mm long) — retune
  # with `tools/train.py`, which prints limits suggested by good pins.
  tolerances:
    length: [21.0, 23.3]               # wrong length / missing tip
    shaft_width: [0.85, 1.25]          # wrong wire gauge
    head_width: [1.0, 2.6]             # misshapen head (loose: head is ~8-12 px)
    straightness_max_dev: [null, 0.25] # bent shaft
    head_symmetry: [0.45, null]        # off-centre / lopsided head (loose: head edge is faint when front-lit)
    head_shaft_ratio: [1.1, null]      # missing or flattened-out head
    tip_angle_deg: [null, 75]          # blunt / broken tip

model:
  path: models/model.json
  # Features the good-pin model learns, with the smallest spread (1 sigma)
  # to assume for each, so a handful of near-identical good pins can't make
  # the model reject normal measurement noise (~0.25-0.75 px).
  features:
    length: 0.08
    shaft_width: 0.04
    head_width: 0.12
    head_thickness: 0.08
    tip_length: 0.12
    straightness_max_dev: 0.04
    head_symmetry: 0.05
  threshold_multiplier: 1.5   # threshold = multiplier x worst good-pin score ...
  min_threshold: 4.0          # ... but never below this many sigma
