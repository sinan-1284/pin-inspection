<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pin Inspection</title>
<style>
:root {
  color-scheme: light;
  --brand: #008100; --bg: #F4F7F3; --surface: #FFFFFF; --border: #D5E3D3;
  --text: #10241A; --muted: #66786D; --bad-text: #A8380A; --bad-bg: #FBEAE2;
  --btn: #002D07; --btn-text: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --brand: #2fae2f; --bg: #111110; --surface: #1a1a19; --border: #2e2e2b;
    --text: #f0efec; --muted: #8f8e87; --bad-text: #f08a5d; --bad-bg: #36200f;
    --btn: #f0efec; --btn-text: #111110;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --brand: #2fae2f; --bg: #111110; --surface: #1a1a19; --border: #2e2e2b;
  --text: #f0efec; --muted: #8f8e87; --bad-text: #f08a5d; --bad-bg: #36200f;
  --btn: #f0efec; --btn-text: #111110;
}
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
  background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
form {
  width: 100%; max-width: 340px; box-sizing: border-box; padding: 28px 24px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
}
.logo { height: 34px; display: block; margin-bottom: 18px; }
h1 { font-size: 20px; margin: 0 0 4px; }
p { margin: 0 0 20px; color: var(--muted); }
label { display: block; font-weight: 600; margin-bottom: 6px; }
input {
  width: 100%; box-sizing: border-box; padding: 10px 12px; font: inherit; font-size: 16px;
  color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
}
input:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
button {
  width: 100%; margin-top: 14px; padding: 10px; font: inherit; font-weight: 600;
  color: var(--btn-text); background: var(--btn); border: 0; border-radius: 8px; cursor: pointer;
}
.error { margin: 12px 0 0; padding: 8px 10px; border-radius: 8px; color: var(--bad-text); background: var(--bad-bg); }
</style>
<script>
try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<form method="post" action="/login">
  <img class="logo" src="/logo.svg" alt="DDLC">
  <h1>Pin Inspection</h1>
  <p>Enter the station password.</p>
  <label for="pw">Password</label>
  <input id="pw" name="password" type="password" autocomplete="current-password" autofocus required>
  <input type="hidden" name="next" value="{{next}}">
  <button type="submit">Open dashboard</button>
  {{error}}
</form>
</body>
</html>
